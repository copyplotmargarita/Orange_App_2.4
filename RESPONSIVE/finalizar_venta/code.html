<!DOCTYPE html>

<html class="dark" lang="es"><head>

<style>
        body {
            background-color: #121318;
            color: #e2e2e8;

            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {

        }

        }
        .custom-scrollbar::-webkit-scrollbar-thumb {

        }

            background-color: #94b8ff;
            color: #1e4787;
        }
        .inactive-payment-method {

            border: 1px solid #434750;

            padding-bottom: env(safe-area-inset-bottom);

<body class="flex flex-col min-h-screen">
<!-- Top App Bar (Shared Component Logic) -->
<header class="flex items-center justify-between px-4 h-16 w-full sticky top-0 bg-background z-50">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-highest transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Finalizar Venta</h1>
</div>
<button class="p-2 hover:bg-surface-container-highest transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile pt-2 pb-40 flex flex-col gap-6 max-w-2xl mx-auto w-full">
<!-- Client Selection -->
<section class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1 uppercase tracking-wider">CLIENTE</label>
<div class="flex gap-2">
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person_search</span>
<input class="w-full h-input-height bg-surface-container border border-outline-variant rounded-xl pl-10 pr-4 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Buscar cliente por nombre o CI..." type="text"/>
</div>
<button class="w-input-height h-input-height bg-surface-container-highest text-primary flex items-center justify-center rounded-xl active:scale-95 transition-transform">
<span class="material-symbols-outlined">person_add</span>
</button>
</div>
</section>
<!-- Payment Section -->
<section class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1 uppercase tracking-wider">MÉTODO DE PAGO</label>
<!-- Currency Toggle -->
<div class="grid grid-cols-2 p-1 bg-surface-container-low rounded-xl gap-1">
<button class="py-3 px-4 rounded-lg font-label-md text-label-md transition-all bg-primary-container text-on-primary-container shadow-sm" id="btn-bs" onclick="toggleCurrency('bs')">
                        Bolívares (Bs)
                    </button>
<button class="py-3 px-4 rounded-lg font-label-md text-label-md transition-all text-on-surface-variant hover:bg-surface-container-high" id="btn-usd" onclick="toggleCurrency('usd')">
                        Dólares ($)
                    </button>
</div>
</div>
<!-- Dynamic Methods Grid -->
<div class="grid grid-cols-3 sm:grid-cols-5 gap-2" id="methods-bs">
<button class="flex flex-col items-center justify-center p-3 rounded-xl active-payment-method transition-all gap-1">
<span class="material-symbols-outlined">point_of_sale</span>
<span class="text-[10px] font-bold">PUNTO</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl inactive-payment-method transition-all gap-1">
<span class="material-symbols-outlined">smartphone</span>
<span class="text-[10px] font-bold">PAGO MÓVIL</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl inactive-payment-method transition-all gap-1">
<span class="material-symbols-outlined">fingerprint</span>
<span class="text-[10px] font-bold">BIO PAGO</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl inactive-payment-method transition-all gap-1">
<span class="material-symbols-outlined">payments</span>
<span class="text-[10px] font-bold">EFECTIVO</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl inactive-payment-method transition-all gap-1">
<span class="material-symbols-outlined">account_balance</span>
<span class="text-[10px] font-bold">TRANSF.</span>
</button>
</div>
<div class="hidden grid grid-cols-2 sm:grid-cols-4 gap-2" id="methods-usd">
<button class="flex flex-col items-center justify-center p-3 rounded-xl inactive-payment-method transition-all gap-1">
<span class="material-symbols-outlined">payments</span>
<span class="text-[10px] font-bold">EFECTIVO</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl inactive-payment-method transition-all gap-1">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="text-[10px] font-bold">ZELLE</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl inactive-payment-method transition-all gap-1">
<span class="material-symbols-outlined">currency_bitcoin</span>
<span class="text-[10px] font-bold">BINANCE</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl inactive-payment-method transition-all gap-1">
<span class="material-symbols-outlined">shopping_cart</span>
<span class="text-[10px] font-bold">PAYPAL</span>
</button>
</div>
<!-- Reference and Amount -->
<div class="grid grid-cols-2 gap-3">
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-outline px-1">MONTO</label>
<div class="bg-surface-container-low border border-outline-variant h-input-height rounded-xl flex items-center px-4 font-price-lg text-primary">
                        Bs 1.041,92
                    </div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-outline px-1">REFERENCIA</label>
<input class="w-full h-input-height bg-surface-container border border-outline-variant rounded-xl px-4 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Últimos 4-6" type="text"/>
</div>
</div>
<button class="w-full h-12 bg-primary-container text-on-primary-container rounded-xl font-headline-md text-headline-md flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-md">
<span class="material-symbols-outlined">add_circle</span>
                AGREGAR PAGO
            </button>
</section>
<!-- Registered Payments -->
<section class="flex flex-col gap-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">PAGOS REGISTRADOS</label>
<span class="text-label-sm font-label-sm text-outline">(1)</span>
</div>
<div class="bg-surface-container border border-outline-variant rounded-xl p-4 flex items-center justify-between group transition-colors hover:bg-surface-container-high">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container/20 text-secondary flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<div class="font-body-md text-body-md font-bold text-on-surface">Pago Móvil (Bs)</div>
<div class="font-body-sm text-body-sm text-outline">Ref: 4421</div>
</div>
</div>
<div class="text-right">
<div class="font-price-lg text-price-lg text-secondary">Bs. 500,00</div>
<button class="font-label-sm text-label-sm text-error uppercase tracking-tighter hover:underline">ELIMINAR</button>
</div>
</div>
</section>
<!-- Change/Vuelto Section -->
<section class="bg-surface-container-lowest border border-outline-variant/50 rounded-2xl p-4 flex flex-col gap-4">
<label class="font-label-md text-label-md text-tertiary px-1 uppercase tracking-wider">REGISTRO DE VUELTO</label>
<div class="grid grid-cols-2 gap-3">
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-outline px-1">VUELTO EN BS</label>
<input class="w-full h-12 bg-surface-container-low border border-outline-variant rounded-lg px-4 text-body-lg text-on-surface focus:border-tertiary focus:ring-1 focus:ring-tertiary outline-none transition-all" type="number" value="0.00"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-outline px-1">VUELTO EN $</label>
<input class="w-full h-12 bg-surface-container-low border border-outline-variant rounded-lg px-4 text-body-lg text-on-surface focus:border-tertiary focus:ring-1 focus:ring-tertiary outline-none transition-all" type="number" value="0.00"/>
</div>
</div>
<button class="w-full h-10 border border-tertiary text-tertiary rounded-lg font-label-md text-label-md hover:bg-tertiary/10 transition-colors uppercase">
                REGISTRAR VUELTO
            </button>
</section>
</main>
<!-- Fixed Footer Dashboard -->
<footer class="fixed bottom-0 w-full z-50 bg-surface-container shadow-[0_-8px_24px_rgba(0,0,0,0.5)] border-t border-outline-variant/30 safe-bottom">
<div class="flex justify-between items-center px-4 py-4 gap-4">
<div class="flex-1 bg-surface-container-high rounded-xl p-3 flex flex-col items-center">
<span class="text-[10px] font-bold text-outline uppercase">TOTAL USD</span>
<span class="text-price-lg font-price-lg text-on-surface">$ 1,35</span>
</div>
<div class="flex-1 bg-surface-container-high rounded-xl p-3 flex flex-col items-center">
<span class="text-[10px] font-bold text-outline uppercase">TOTAL BS</span>
<span class="text-price-lg font-price-lg text-on-surface">Bs. 1.041,92</span>
</div>
</div>
<div class="px-4 pb-4">
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md font-bold rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition-transform">
<span class="material-symbols-outlined">shopping_cart_checkout</span>
                FINALIZAR TRANSACCIÓN
            </button>
</div>
</footer>
<!-- Bottom Navigation (Shared Component Logic - Suppressed per transactional screen rule) -->
<!-- However, the prompt implies this is part of the flow but we keep the transactional focus high -->
<script>
        function toggleCurrency(type) {
            const btnBs = document.getElementById('btn-bs');
            const btnUsd = document.getElementById('btn-usd');
            const methodsBs = document.getElementById('methods-bs');
            const methodsUsd = document.getElementById('methods-usd');

            if (type === 'bs') {
                btnBs.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
                btnBs.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-high');
                
                btnUsd.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
                btnUsd.classList.add('text-on-surface-variant', 'hover:bg-surface-container-high');
                
                methodsBs.classList.remove('hidden');
                methodsUsd.classList.add('hidden');
            } else {
                btnUsd.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
                btnUsd.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-high');
                
                btnBs.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
                btnBs.classList.add('text-on-surface-variant', 'hover:bg-surface-container-high');
                
                methodsUsd.classList.remove('hidden');
                methodsBs.classList.add('hidden');
                methodsUsd.classList.add('grid');
            }
        }

        // Ripple/Interaction effect simulation
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                if (this.id.includes('btn-')) return; // handled by toggle
                const ripple = document.createElement('span');
                ripple.classList.add('absolute', 'inset-0', 'bg-white/10', 'animate-ping', 'rounded-full');
                this.style.position = 'relative';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 400);
            });
        });
    </script>
</body></html>
