<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Seleccionar Productos - Obsidian Metric</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#10131c",
                    "tertiary": "#efc209",
                    "surface-variant": "#32343e",
                    "primary-fixed": "#d4e3ff",
                    "outline-variant": "#414751",
                    "on-surface-variant": "#c1c7d3",
                    "on-error": "#690005",
                    "surface-container-highest": "#32343e",
                    "background": "#10131c",
                    "on-error-container": "#ffdad6",
                    "on-primary-fixed": "#001c39",
                    "on-primary-container": "#002a51",
                    "secondary-container": "#06bb63",
                    "primary-fixed-dim": "#a4c9ff",
                    "surface-container-low": "#181b24",
                    "secondary": "#4ae183",
                    "error-container": "#93000a",
                    "surface-bright": "#363943",
                    "on-tertiary-fixed-variant": "#574500",
                    "on-primary-fixed-variant": "#004883",
                    "tertiary-container": "#cea700",
                    "error": "#ffb4ab",
                    "primary-container": "#4d93e5",
                    "inverse-surface": "#e0e2ee",
                    "on-tertiary": "#3c2f00",
                    "tertiary-fixed": "#ffe084",
                    "on-background": "#e0e2ee",
                    "outline": "#8b919d",
                    "tertiary-fixed-dim": "#eec209",
                    "surface-dim": "#10131c",
                    "on-secondary": "#003919",
                    "primary": "#a4c9ff",
                    "surface-container-high": "#272a33",
                    "on-tertiary-fixed": "#231b00",
                    "on-tertiary-container": "#4e3e00",
                    "inverse-primary": "#0060ac",
                    "inverse-on-surface": "#2d303a",
                    "on-secondary-fixed": "#00210c",
                    "on-secondary-container": "#00431f",
                    "surface-tint": "#a4c9ff",
                    "surface-container-lowest": "#0b0e16",
                    "surface-container": "#1c1f28",
                    "on-surface": "#e0e2ee",
                    "on-primary": "#00315d",
                    "secondary-fixed": "#6bfe9c",
                    "secondary-fixed-dim": "#4ae183",
                    "on-secondary-fixed-variant": "#005228"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "unit": "4px",
                    "margin-mobile": "16px",
                    "md": "16px",
                    "xs": "4px",
                    "lg": "24px",
                    "gutter": "12px",
                    "sm": "8px"
            },
            "fontFamily": {
                    "headline-lg": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"],
                    "label-caps": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "data-mono": ["JetBrains Mono"],
                    "body-lg": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-caps": ["11px", {"lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "data-mono": ["13px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #10131c;
            color: #e0e2ee;
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #414751;
            border-radius: 10px;
        }
        .glass-header {
            background: rgba(16, 19, 28, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #414751;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden" style="width: 390px; margin: 0 auto; position: relative;">
<!-- Top AppBar -->
<header class="glass-header sticky top-0 z-50 flex items-center justify-between px-margin-mobile h-16 w-full shrink-0">
<div class="flex items-center gap-2">
<button class="active:scale-95 transition-transform p-2 -ml-2 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Cargar Compra</h1>
</div>
<div class="flex items-center gap-2">
<button class="font-label-caps text-label-caps px-3 py-1.5 text-on-surface-variant hover:text-on-surface border border-outline-variant rounded-lg active:opacity-80">PAUSAR</button>
</div>
</header>
<!-- Search & Quick Actions -->
<div class="bg-surface border-b border-outline-variant p-margin-mobile space-y-3 shadow-md z-40 shrink-0">
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 text-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-on-surface-variant" placeholder="Buscar en catálogo..." type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
</div>
<div class="flex gap-gutter">
<button class="flex-1 font-label-caps text-label-caps py-2.5 px-2 border border-dashed border-outline-variant rounded-xl hover:bg-surface-variant active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">inventory_2</span>
                BUSCAR EXISTENTE
            </button>
<button class="flex-1 font-label-caps text-label-caps py-2.5 px-2 bg-surface-container-high border border-outline-variant rounded-xl hover:bg-surface-bright active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">add</span>
                CREAR PRODUCTO
            </button>
</div>
</div>
<!-- Product List -->
<main class="flex-1 overflow-y-auto custom-scrollbar px-margin-mobile py-md pb-32">
<div class="grid grid-cols-1 gap-sm">
<!-- Product Card 1 -->
<div class="bg-surface-container-low border border-outline-variant p-md rounded-xl hover:bg-surface-variant cursor-pointer transition-colors flex justify-between items-center group">
<div class="space-y-1">
<h3 class="font-body-lg text-body-lg text-on-surface">Arroz Aurora T1 900gr</h3>
<div class="flex items-center gap-2">
<span class="font-label-caps text-label-caps text-secondary">0 Unidad</span>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Compra: Unidad</span>
</div>
</div>
<button class="p-2 bg-surface-container-highest rounded-lg group-active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary">add_shopping_cart</span>
</button>
</div>
<!-- Product Card 2 -->
<div class="bg-surface-container-low border border-outline-variant p-md rounded-xl hover:bg-surface-variant cursor-pointer transition-colors flex justify-between items-center group">
<div class="space-y-1">
<h3 class="font-body-lg text-body-lg text-on-surface">Arvejas Verdes Partidas 400gr</h3>
<div class="flex items-center gap-2">
<span class="font-label-caps text-label-caps text-secondary">12 Unidad</span>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Compra: Unidad</span>
</div>
</div>
<button class="p-2 bg-surface-container-highest rounded-lg">
<span class="material-symbols-outlined text-primary">add_shopping_cart</span>
</button>
</div>
<!-- Product Card 3 -->
<div class="bg-surface-container-low border border-outline-variant p-md rounded-xl hover:bg-surface-variant cursor-pointer transition-colors flex justify-between items-center group">
<div class="space-y-1">
<h3 class="font-body-lg text-body-lg text-on-surface">Atun Margarita Lomo Aceite</h3>
<div class="flex items-center gap-2">
<span class="font-label-caps text-label-caps text-error">4 Unidad</span>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Compra: Caja</span>
</div>
</div>
<button class="p-2 bg-surface-container-highest rounded-lg">
<span class="material-symbols-outlined text-primary">add_shopping_cart</span>
</button>
</div>
<!-- Product Card 4 -->
<div class="bg-surface-container-low border border-outline-variant p-md rounded-xl hover:bg-surface-variant cursor-pointer transition-colors flex justify-between items-center group">
<div class="space-y-1">
<h3 class="font-body-lg text-body-lg text-on-surface">Azucar Refinada Aurora 1kg</h3>
<div class="flex items-center gap-2">
<span class="font-label-caps text-label-caps text-secondary">0 Unidad</span>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Compra: Bulto</span>
</div>
</div>
<button class="p-2 bg-surface-container-highest rounded-lg">
<span class="material-symbols-outlined text-primary">add_shopping_cart</span>
</button>
</div>
<!-- Product Card 5 -->
<div class="bg-surface-container-low border border-outline-variant p-md rounded-xl hover:bg-surface-variant cursor-pointer transition-colors flex justify-between items-center group">
<div class="space-y-1">
<h3 class="font-body-lg text-body-lg text-on-surface">Cafe Aurora Gourmet 100gr</h3>
<div class="flex items-center gap-2">
<span class="font-label-caps text-label-caps text-secondary">24 Unidad</span>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Compra: Bulto</span>
</div>
</div>
<button class="p-2 bg-surface-container-highest rounded-lg">
<span class="material-symbols-outlined text-primary">add_shopping_cart</span>
</button>
</div>
</div>
</main>
<!-- Bottom Action Button -->
<div class="fixed bottom-0 left-0 w-full px-margin-mobile pb-6 pt-4 bg-gradient-to-t from-background via-background to-transparent z-50">
<button class="w-full py-4 rounded-xl font-bold text-headline-md active:scale-[0.98] transition-transform shadow-xl bg-primary-container text-white" style="background-color: #4A90E2;">
            SIGUIENTE
        </button>
</div>
<script>
        // Visual feedback for interactions
        document.querySelectorAll('main > div > div').forEach(card => {
            card.addEventListener('click', () => {
                const btn = card.querySelector('button');
                btn.classList.add('bg-primary', 'text-on-primary');
                setTimeout(() => {
                    btn.classList.remove('bg-primary', 'text-on-primary');
                }, 400);
            });
        });
    </script>
</body></html>
